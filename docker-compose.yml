version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Pass123"
    ports:
      - "1433:1433"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internal-request-app
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"